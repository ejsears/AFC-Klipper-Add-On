# EMU single-lane reference template.
# The installer generates a complete multi-lane config from this layout.
# MCU name, lane numbers, and unit name are substituted at install time.

[include mcu/EMU_EMU_1.cfg]

[mcu EMU_1_lane1]
canbus_uuid: <replace with your can UUID>
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above

[temperature_sensor EMU_1_lane1]
sensor_type: temperature_mcu
sensor_mcu: EMU_1_lane1

[AFC_EMU EMU_1]
hub: EMU_1_HUB
extruder: extruder
buffer: EMU_1_buffer
long_moves_speed: 300   # Speed has been tested up to 500mm, recommend running 400mm/s or less
long_moves_accel: 300

[AFC_stepper lane1]
unit: EMU_1:1
step_pin: EMU_1_lane1:MOT_STEP
dir_pin: EMU_1_lane1:MOT_DIR
enable_pin: !EMU_1_lane1:MOT_EN
microsteps: 16
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 2000
park_dist: 10
led_index: EMU_1_Indicator_1:1
led_spool_index: EMU_1_Indicator_1:2
prep: ^!EMU_1_lane1:TRG
load: ^EMU_1_lane1:LOAD

[tmc2209 AFC_stepper lane1]
uart_pin: EMU_1_lane1:MOT_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane1]
pin: ^!EMU_1_lane1:BUTTON

[temperature_sensor lane1]
sensor_type: BME280
i2c_address: 118
i2c_mcu: EMU_1_lane1
i2c_software_scl_pin: EMU_1_lane1:TEMP_SCL
i2c_software_sda_pin: EMU_1_lane1:TEMP_SCA

[controller_fan EMU_1_fan_lane1]
pin: EMU_1_lane1:FAN
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane1

[AFC_led EMU_1_Indicator_1]
pin: EMU_1_lane1:RGB
chain_count: 2
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[AFC_buffer EMU_1_buffer]
advance_pin: EMU_1_lane1:BUFFER_ADV
trailing_pin: EMU_1_lane1:BUFFER_TRL
multiplier_high: 1.15
multiplier_low: 0.90

# EMU hub defaults to virtual (no sensor). To use a physical hub sensor:
#  - Replace "virtual" with the actual sensor pin
#  - Update dist_hub in each AFC_stepper section to the PTFE length between
#    the load sensor and hub sensor
#  - Remove/comment out the `use_dist_hub: True` line
[AFC_hub EMU_1_HUB]
afc_bowden_length: 2000     # Length of the Bowden tube from the hub to the toolhead sensor in mm.
hub_clear_move_dis: 5
switch_pin: virtual
use_dist_hub: True
